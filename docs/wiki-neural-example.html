<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>wiki network</title>
<style>
  :root { --bg: #070b16; --ink: #cfd6e4; --mute: #7b8496; --accent: #ff5a5a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #brand { position: fixed; top: 14px; left: 16px; z-index: 5; font-size: 13px; color: var(--mute); }
  #brand b { color: var(--ink); font-weight: 600; }
  #lock { position: fixed; top: 10px; right: 14px; z-index: 5; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15); color: var(--ink); border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #unlockbox { position: fixed; top: 46px; right: 14px; z-index: 6; display: none;
    background: rgba(16,22,36,.92); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 10px; }
  #unlockbox input { background: #0b1020; color: var(--ink); border: 1px solid #2a3348; border-radius: 6px;
    padding: 6px 8px; font-size: 13px; width: 180px; }
  #pwmsg { font-size: 11px; color: var(--mute); margin-top: 6px; min-height: 14px; }
  #tip { position: fixed; z-index: 7; pointer-events: none; display: none; max-width: 340px;
    background: rgba(10,14,26,.92); border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
    padding: 5px 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #panel { position: fixed; left: 14px; bottom: 14px; z-index: 6; display: none; width: min(560px, calc(100vw - 28px));
    max-height: 72vh; overflow: auto; background: rgba(10,14,26,.94); border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  #panel h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.35; }
  #panel .meta { color: var(--mute); font-size: 11px; margin-bottom: 8px; font-family: ui-monospace, Menlo, monospace; }
  #panel .grp { color: var(--accent); font: 11px ui-monospace, Menlo, monospace; margin: 8px 0 2px; }
  #panel a { display: block; color: #9cc3ff; text-decoration: none; padding: 1px 0; cursor: pointer; }
  #panel .body { white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; color: #dfe5f1; border-top: 1px solid rgba(255,255,255,.12);
    border-bottom: 1px solid rgba(255,255,255,.12); margin: 10px 0; padding: 10px 0; }
  #panel .body a { display: inline; }
  #panel .md { white-space: normal; }
  #panel .md h1 { font-size: 14px; margin: 0 0 6px; } #panel .md h2 { font-size: 13px; margin: 12px 0 4px; color: #9cc3ff; }
  #panel .md h3 { font-size: 12.5px; margin: 10px 0 4px; } #panel .md p, #panel .md li { margin: 4px 0; }
  #panel .md table { border-collapse: collapse; font-size: 11.5px; margin: 6px 0; display: block; overflow-x: auto; }
  #panel .md th, #panel .md td { border: 1px solid rgba(255,255,255,.16); padding: 2px 6px; vertical-align: top; }
  #panel .md code { font-size: 11.5px; background: rgba(255,255,255,.08); padding: 0 3px; border-radius: 3px; }
  #panel .x { position: absolute; top: 6px; right: 10px; cursor: pointer; color: var(--mute); }
  #hint { position: fixed; bottom: 12px; right: 16px; z-index: 5; font-size: 11px; color: var(--mute); }
  body.embed #brand, body.embed #lock, body.embed #hint { display: none; }
  @media (max-width: 600px) { #brand span, #hint { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="brand"><b>wiki network</b><span> · sources → notes → hubs → MOC → index</span></div>
<button id="lock">unlock titles</button>
<div id="unlockbox"><input id="pw" type="password" placeholder="password" autocomplete="off"><div id="pwmsg"></div></div>
<div id="tip"></div>
<div id="panel"><span class="x" id="px">×</span><div id="pbody"></div></div>
<div id="hint">hover a neuron · click to inspect</div>

const PLAIN = {"names": ["2026-03-seminar-notes-level-alignment", "2026-01-lab-notes-scf", "2026-02-reading-notes-negf", "Pseudopotential은 core 전자를 제거하고 valence 전자의 산란 성질만 재현해 계산 비용을 줄인다", "Plane-wave cutoff는 목표 물리량의 차이가 허용 오차 안에 들어올 때까지 올려서 정한다", "Kohn-Sham 방정식은 상호작용 전자의 ground-state density를 비상호작용 보조계의 단일입자 방정식으로 재현한다", "Exchange-correlation functional의 선택이 DFT 결과의 정확도와 체계적 오차를 정한다", "LDA와 GGA는 dispersion 상호작용을 담지 못하므로 분자 흡착 기하에는 van der Waals 보정이 필요하다", "SCF 수렴은 mixing 방식과 금속의 charge sloshing 억제에 좌우된다", "Semilocal DFT의 Kohn-Sham gap은 준입자 gap보다 체계적으로 작고 분자 HOMO는 너무 높게 놓인다", "Numerical atomic orbital basis는 국소성 덕분에 큰 계와 NEGF transport 계산에 적합하지만 수렴을 체계적으로 점검하기 어렵다", "k-point grid는 Brillouin zone 적분 오차를 정하며 금속일수록 더 촘촘한 grid를 요구한다", "DFT+Σ는 기체상 IP/EA 보정과 전극 image-charge 보정으로 분자 준위를 옮겨 transmission resonance 위치를 고친다", "PDOS는 전체 DOS를 원자와 orbital 성분으로 나눠 transmission peak와 band의 orbital 기원을 판정하게 한다", "유한 bias I-V 곡선은 bias마다 non-equilibrium density를 self-consistent하게 다시 구하고 bias window의 transmission을 적분해서 얻는다", "Eigenchannel 분석은 transmission을 서로 독립인 채널로 분해해 전류가 흐르는 orbital 경로를 실공간에서 보여준다", "분자 접합의 transmission peak 위치는 분자 준위 정렬을, peak 폭은 전극 coupling을 나타낸다", "전극 self-energy는 반무한 주기 전극을 device 경계의 유한 행렬로 접어 넣는다", "NEGF는 전극에 연결된 device의 transmission을 Green function과 self-energy로 계산하고 Landauer 공식으로 전류를 준다", "Transport 계산에서 전극 bulk 계산은 transport 방향 k-point를 촘촘히 잡고 device 계산은 그 방향을 1점으로 둔다", "1D 나노와이어 전극 사이 분자 접합의 transmission 계산을 전극 수렴부터 I-V까지 순서대로 익히는 예시 프로젝트", "DFT 기초 개념과 수렴 설정을 모은 목차", "NEGF 기반 분자 접합 전자수송 개념을 모은 목차", "Index"], "slugs": ["2026-03-seminar-notes-level-alignment", "2026-01-lab-notes-scf", "2026-02-reading-notes-negf", "pseudopotentials", "plane-wave-cutoff-convergence", "kohn-sham-equations", "exchange-correlation-functionals", "van-der-waals-corrections", "scf-mixing-convergence", "dft-band-gap-underestimation", "basis-sets-numerical-atomic-orbitals", "k-point-sampling", "dft-sigma-level-correction", "pdos-projection", "finite-bias-iv-curves", "eigenchannel-analysis", "transmission-function-interpretation", "electrode-self-energy", "negf-landauer-formula", "kpoints-in-transport-direction", "proj-example-nanowire-transport", "moc-dft-basics", "moc-quantum-transport", "Index"], "texts": ["# 2026-03 세미나 메모: 분자 준위 정렬과 DFT+Σ\n\n가상의 학습용 메모. 공개 논문(Neaton, Hybertsen, Louie, PRL 97, 216405, 2006) 내용을 정리함.\n\n- 문제: semilocal DFT로 계산한 분자 접합의 conductance가 실험보다 큰 경향. 원인 후보는 HOMO/LUMO 위치.\n- 기체상 분자: Kohn-Sham HOMO 에너지의 절댓값이 ionization potential보다 작음. gap도 작게 나옴.\n- 금속 표면 근처: 전극의 polarization(image charge)이 준입자 gap을 줄임. semilocal DFT는 이 효과를 담지 못함.\n- 보정 아이디어 두 단계: (1) 기체상 IP/EA에 맞추는 shift, (2) 고전 image-charge 모형으로 gap을 다시 줄이는 shift.\n- image plane 위치와 분자-전극 거리에 보정량이 민감함. 이 값의 선택 근거를 반드시 기록할 것.\n- 다음 할 일: 보정 전후 T(E)에서 peak가 E_F로부터 어떻게 멀어지는지 비교하는 절차 정리.", "# 2026-01 실습 메모: 금속 전극 slab의 SCF 수렴\n\n가상의 학습용 메모. 특정 계산 결과는 없음.\n\n- 증상: 금속 slab에서 SCF 잔차가 줄지 않고 진동함.\n- 첫 점검: mixing weight를 낮추고 history 길이를 늘림. Pulay/Broyden 계열이 단순 linear mixing보다 안정적이었음.\n- 금속에서는 긴 파장의 charge sloshing이 원인일 수 있음. Kerker 형태의 preconditioning 항목을 매뉴얼에서 찾아볼 것.\n- Fermi 준위 근처 occupation이 반복마다 뒤집히면 electronic smearing을 켬. smearing 폭을 바꾸면 total energy가 달라지므로 비교 계산끼리 같은 값을 써야 함.\n- k-point grid가 너무 성기면 금속의 Fermi surface 표현이 흔들려 수렴이 느려짐. grid 수렴을 먼저 확인함.\n- 수렴 기준은 density matrix 변화와 total energy 변화 두 가지를 함께 기록.\n- 다음 할 일: transport 계산에서 유한 bias를 걸면 같은 문제가 더 심해지는지 확인.", "# 2026-02 읽기 메모: NEGF와 Landauer 공식\n\n가상의 학습용 메모. Datta 교재와 Brandbyge et al. (2002) 읽으면서 정리.\n\n- 계를 left electrode / device / right electrode로 나눔. 전극은 반무한이고 주기적.\n- 전극의 영향은 self-energy Σ_L, Σ_R로 device Hamiltonian에 더해짐. Σ의 허수부에서 broadening Γ = i(Σ − Σ†)가 나옴.\n- retarded Green function G = [ES − H − Σ_L − Σ_R]^(-1).\n- transmission T(E) = Tr[Γ_L G Γ_R G†]. 0 bias, 저온 극한에서 conductance G = G0 T(E_F), G0 = 2e²/h.\n- 전극 surface Green function은 반복 decimation으로 구함 (Lopez Sancho 방식).\n- 질문: 전극 계산의 k-point를 transport 방향으로 얼마나 촘촘히 잡아야 하는가? device 계산과 어떻게 맞추는가?\n- 질문: 유한 bias에서는 density를 equilibrium contour와 non-equilibrium window로 나눠 적분한다고 함. 다음 달에 정리.", "# Pseudopotentials\n\npseudopotential은 화학 결합에 거의 참여하지 않는 core 전자를 유효 퍼텐셜로 바꾸고 cutoff radius 밖에서 all-electron 결과와 같은 valence 파동함수를 주도록 만듦.\n\n## Summary\n\n- norm-conserving: cutoff radius 안의 전하량을 all-electron 값과 맞춤 (Hamann-Schlüter-Chiang, Troullier-Martins).\n- ultrasoft: norm 조건을 풀어 더 부드러운 파동함수를 허용함 (Vanderbilt).\n- PAW: all-electron 파동함수를 재구성할 수 있는 projector 방식 (Blöchl).\n\n## Details\n\ncore 근처의 valence 파동함수는 core orbital과 직교하기 위해 빠르게 진동함. 이 진동을 표현하려면 큰 [[plane-wave-cutoff-convergence]]가 필요하므로, pseudopotential은 cutoff radius 안쪽 파동함수를 노드 없는 매끄러운 함수로 바꿈.\n\ncutoff radius가 클수록 pseudopotential은 부드러워지고 필요한 cutoff가 줄지만 이웃 원자와 core 영역이 겹치는 짧은 결합에서는 transferability가 떨어짐. semicore 상태(예: 전이금속의 상위 s, p 껍질)를 valence에 포함할지도 같은 trade-off임.\n\nKleinman-Bylander 형태는 nonlocal 부분을 separable projector로 써서 계산을 효율화함. 이 형태에서는 ghost state가 생길 수 있으므로 새 pseudopotential은 원자 계산과 간단한 결정 계산으로 검증함.\n\npseudopotential은 생성 시 사용한 [[exchange-correlation-functionals]]와 같은 functional로 써야 일관성이 유지됨. 국소 basis 코드에서는 pseudopotential과 [[basis-sets-numerical-atomic-orbitals]]가 원소별로 짝을 이룸.\n\n## Connections\n\n- [[plane-wave-cutoff-convergence]] — pseudopotential hardness가 cutoff를 정함\n- [[exchange-correlation-functionals]] — 생성 functional과 사용 functional의 일치\n- [[basis-sets-numerical-atomic-orbitals]] — 국소 basis 코드에서 원소별 짝\n\n## Refs\n\n- D. R. Hamann, M. Schlüter, and C. Chiang, Phys. Rev. Lett. 43, 1494 (1979).\n- L. Kleinman and D. M. Bylander, Phys. Rev. Lett. 48, 1425 (1982).\n- D. Vanderbilt, Phys. Rev. B 41, 7892 (1990).\n- N. Troullier and J. L. Martins, Phys. Rev. B 43, 1993 (1991).\n- P. E. Blöchl, Phys. Rev. B 50, 17953 (1994).", "# Plane-Wave Cutoff Convergence\n\nplane-wave basis의 크기는 kinetic energy cutoff 하나로 정해지며 cutoff는 total energy 자체가 아니라 비교하려는 에너지 차이·힘·응력의 수렴으로 판정함.\n\n## Summary\n\n- basis는 |k+G|²/2 < E_cut 조건을 만족하는 plane wave 전부임.\n- cutoff를 올리면 total energy는 단조 감소하지만 에너지 차이는 더 빨리 수렴하는 경우가 많음.\n- 필요한 cutoff는 [[pseudopotentials]]의 hardness가 정함.\n\n## Details\n\nplane wave는 원자 위치와 무관한 basis라 Pulay force가 없고 cutoff 하나로 체계적 수렴이 가능함. 이 점이 [[basis-sets-numerical-atomic-orbitals]]와 비교되는 장점임.\n\n수렴 절차는 다음과 같음.\n\n1. 고정된 구조와 [[k-point-sampling]] 조건에서 cutoff만 단계적으로 올림.\n2. 목표 물리량(흡착 에너지, 격자 상수, 원자 힘)의 변화를 기록함.\n3. 변화가 허용 오차 이하가 되는 가장 낮은 cutoff를 고르고 같은 프로젝트의 비교 계산에 모두 같은 값을 씀.\n\ncell 크기를 바꾸는 relaxation에서는 plane wave 개수가 고정되어 유효 cutoff가 바뀜 (Pulay stress). 이 경우 수렴된 값보다 높은 cutoff를 쓰거나 cell을 바꾼 뒤 다시 계산함.\n\nlocal orbital 코드에서도 real-space grid의 미세도를 같은 방식으로 수렴시킴. 예를 들어 SIESTA의 mesh cutoff는 Hartree·XC 퍼텐셜을 표현하는 grid를 정하며 basis 크기와는 별개로 점검해야 함.\n\n## Connections\n\n- [[pseudopotentials]] — 필요한 cutoff를 정하는 요인\n- [[k-point-sampling]] — cutoff와 함께 수렴시켜야 하는 다른 축\n- [[basis-sets-numerical-atomic-orbitals]] — 국소 basis와의 비교\n\n## Refs\n\n- M. C. Payne, M. P. Teter, D. C. Allan, T. A. Arias, and J. D. Joannopoulos, Rev. Mod. Phys. 64, 1045 (1992).", "# Kohn-Sham Equations\n\nKohn-Sham 방정식은 다전자 문제를 effective potential 속 단일입자 문제로 바꾸고 근사는 exchange-correlation 항 하나에 모은다.\n\n## Summary\n\n- Hohenberg-Kohn 정리: 외부 퍼텐셜과 ground-state density는 일대일 대응이고 에너지 functional의 최솟값이 ground-state energy임.\n- Kohn-Sham 방식: 같은 density를 갖는 가상의 비상호작용 전자계를 도입함.\n- 미지의 다체 효과는 exchange-correlation energy E_xc[n]에 모두 들어감.\n\n## Details\n\nKohn-Sham 방정식은 [−(1/2)∇² + v_ext(r) + v_H(r) + v_xc(r)] φ_i(r) = ε_i φ_i(r) 형태임 (atomic units). density는 occupied orbital의 합 n(r) = Σ_i |φ_i(r)|²로 구함. v_H와 v_xc가 n에 의존하므로 방정식은 self-consistent하게 풀어야 하며 이 반복 과정의 안정성은 [[scf-mixing-convergence]]에서 다룸.\n\norbital을 전개하는 basis 선택이 실제 계산의 정확도와 비용을 정함. plane wave는 [[plane-wave-cutoff-convergence]], 국소 basis는 [[basis-sets-numerical-atomic-orbitals]]에 정리함. core 전자는 보통 [[pseudopotentials]]로 대체함.\n\nKohn-Sham eigenvalue ε_i는 원칙적으로 보조계의 Lagrange multiplier임. exact functional에서도 최고 점유 준위만 ionization potential과 일치하며 나머지 eigenvalue를 준입자 에너지로 읽으면 체계적 오차가 생김. 이 점이 [[dft-band-gap-underestimation]]의 출발점임.\n\n주기계에서는 Bloch 정리로 orbital에 k 지표가 붙고 density 계산은 Brillouin zone 적분이 됨 ([[k-point-sampling]]).\n\n## Connections\n\n- [[exchange-correlation-functionals]] — 유일한 근사 항 E_xc의 선택지\n- [[scf-mixing-convergence]] — self-consistent 해를 찾는 반복 절차\n- [[dft-band-gap-underestimation]] — eigenvalue를 준입자 에너지로 해석할 때의 한계\n- [[k-point-sampling]] — 주기계에서 density를 구하는 BZ 적분\n\n## Refs\n\n- P. Hohenberg and W. Kohn, Phys. Rev. 136, B864 (1964).\n- W. Kohn and L. J. Sham, Phys. Rev. 140, A1133 (1965).", "# Exchange-Correlation Functionals\n\nDFT의 근사는 E_xc[n] 하나에 모이며 functional 위계(LDA → GGA → hybrid)를 올라갈수록 비용과 정확도가 함께 올라감.\n\n## Summary\n\n- LDA: 각 지점의 density만 사용하는 균일 전자 기체 근사.\n- GGA(PBE 등): density gradient를 추가함. 고체·분자 구조 계산의 표준 선택.\n- hybrid(HSE 등): Hartree-Fock exchange 일부를 섞음. gap과 준위 위치를 개선하지만 비용이 큼.\n\n## Details\n\nLDA는 균일 전자 기체의 correlation energy(quantum Monte Carlo 결과)를 parametrize해서 씀. 결합 길이를 짧게, 결합 에너지를 크게 주는 경향이 알려져 있음.\n\nGGA는 gradient 의존성을 넣어 LDA의 overbinding을 줄임. PBE는 실험 데이터에 fitting하지 않고 exact 조건으로 만든 non-empirical functional임. 다만 LDA와 GGA 모두 self-interaction error를 가지며 이 때문에 분자 HOMO가 너무 높게 놓이고 gap이 작게 나옴 ([[dft-band-gap-underestimation]]).\n\nLDA와 GGA는 국소적 functional이라 멀리 떨어진 전하 요동 사이의 dispersion 상호작용을 담지 못함. 분자와 전극 사이 흡착 기하에서는 [[van-der-waals-corrections]]를 따로 더함.\n\nhybrid functional은 HF exchange를 일부 섞어 self-interaction을 부분적으로 상쇄함. HSE는 exchange를 short-range와 long-range로 나누고 short-range에만 HF를 섞어 금속·고체 계산 비용을 낮춤. 그러나 큰 transport 계산에 hybrid를 쓰기는 어렵고 대신 사후 준위 보정 [[dft-sigma-level-correction]]이 자주 쓰임.\n\n## Connections\n\n- [[kohn-sham-equations]] — E_xc가 들어가는 자리\n- [[dft-band-gap-underestimation]] — semilocal functional의 gap 오차\n- [[van-der-waals-corrections]] — semilocal functional이 놓치는 분산 상호작용\n- [[dft-sigma-level-correction]] — 큰 계에서 hybrid 대신 쓰는 준위 보정\n\n## Refs\n\n- D. M. Ceperley and B. J. Alder, Phys. Rev. Lett. 45, 566 (1980).\n- J. P. Perdew and A. Zunger, Phys. Rev. B 23, 5048 (1981).\n- J. P. Perdew, K. Burke, and M. Ernzerhof, Phys. Rev. Lett. 77, 3865 (1996).\n- J. Heyd, G. E. Scuseria, and M. Ernzerhof, J. Chem. Phys. 118, 8207 (2003).", "# Van der Waals Corrections\n\ndispersion은 떨어진 두 전하 분포의 상관된 요동에서 생기는 비국소 상관 효과라서, 국소 또는 semilocal [[exchange-correlation-functionals]]로는 재현되지 않음.\n\n## Summary\n\n- 원자쌍 보정(DFT-D2, DFT-D3): −C6/R⁶ 형태 항을 damping 함수와 함께 total energy에 더함.\n- 비국소 functional(vdW-DF): correlation에 두 지점 density를 잇는 비국소 kernel을 넣음.\n- Tkatchenko-Scheffler: C6 계수를 Hirshfeld 분할로 원자 환경에 맞게 조정함.\n\n## Details\n\n원자쌍 보정은 계산 비용이 거의 없고 기존 functional에 그대로 덧붙일 수 있음. D2는 원소별 고정 C6 계수를 쓰고 D3는 배위수에 따라 C6를 바꾸며 three-body 항을 선택적으로 포함함. 짧은 거리에서는 functional 자체가 이미 일부 상관을 담으므로 damping 함수로 이중 계산을 피함.\n\nvdW-DF 계열은 dispersion을 functional 안에서 self-consistent하게 다루며 층상 물질과 표면 흡착에 널리 쓰임. 짝을 이루는 exchange functional의 선택에 따라 결과가 달라짐.\n\n분자 접합에서 vdW 보정은 주로 분자-전극 거리와 흡착 기하를 바꿈. 거리 변화는 전극과의 coupling(T(E) peak 폭)과 image-charge 보정량에 직접 영향을 주므로, transport 계산 전 구조 relaxation 단계에서 어떤 보정을 썼는지 기록해야 함 ([[dft-sigma-level-correction]], [[transmission-function-interpretation]]).\n\nvdW 보정은 Kohn-Sham eigenvalue 자체를 크게 바꾸지 않으므로 [[dft-band-gap-underestimation]] 문제를 해결하지 않음.\n\n## Connections\n\n- [[exchange-correlation-functionals]] — semilocal functional이 dispersion을 놓치는 이유\n- [[dft-sigma-level-correction]] — 흡착 거리가 image-charge 보정량을 바꿈\n- [[transmission-function-interpretation]] — 흡착 기하가 peak 폭을 바꿈\n- [[proj-example-nanowire-transport]] — 접합 구조 relaxation 단계에서 사용\n\n## Refs\n\n- S. Grimme, J. Comput. Chem. 27, 1787 (2006).\n- S. Grimme, J. Antony, S. Ehrlich, and H. Krieg, J. Chem. Phys. 132, 154104 (2010).\n- M. Dion, H. Rydberg, E. Schröder, D. C. Langreth, and B. I. Lundqvist, Phys. Rev. Lett. 92, 246401 (2004).\n- A. Tkatchenko and M. Scheffler, Phys. Rev. Lett. 102, 073005 (2009).", "# SCF Mixing and Convergence\n\nKohn-Sham 방정식의 self-consistent 해는 입력 density(또는 density matrix)를 반복 갱신해 찾으며 갱신 규칙인 mixing이 수렴 속도와 안정성을 정함.\n\n## Summary\n\n- linear mixing: 새 입력 = 이전 입력 + α × 잔차. 단순하지만 느리고 금속에서 진동하기 쉬움.\n- Pulay(DIIS)·Broyden: 이전 여러 step의 잔차 history로 다음 입력을 외삽함.\n- Kerker preconditioning: 긴 파장 성분의 mixing을 줄여 금속의 charge sloshing을 억제함.\n\n## Details\n\n반복 k에서 출력 density와 입력 density의 차이가 잔차 R_k임. linear mixing의 mixing weight α가 크면 진동하고 작으면 수렴이 느림. Pulay 방식은 최근 history의 잔차를 선형 결합해 잔차 norm이 최소가 되는 입력을 고르고 Broyden 방식은 Jacobian 역행렬을 반복마다 근사 갱신함.\n\n큰 cell의 금속에서는 작은 wave vector q의 density 요동이 Hartree 항에서 1/q²로 증폭되어 charge sloshing이 생김. Kerker preconditioning은 작은 q 성분의 mixing을 줄여 이를 억제함. 실습 메모 [[2026-01-lab-notes-scf]]의 진동 증상이 이 경우에 해당함.\n\n수렴이 나쁠 때의 점검 순서는 다음과 같음.\n\n1. mixing weight를 낮추고 history 길이를 늘림.\n2. 금속이면 electronic smearing을 확인함 ([[k-point-sampling]]).\n3. 초기 density를 수렴된 근처 계산에서 가져옴 (restart).\n\ntransport 계산에서는 open boundary 때문에 device density가 전극 Fermi 준위에 묶이며 유한 bias에서는 non-equilibrium 항이 추가되어 수렴이 더 어려워짐 ([[finite-bias-iv-curves]]). 이전 bias의 density matrix를 다음 bias의 초기값으로 쓰는 방법이 표준임.\n\n수렴 판정은 density matrix 변화와 total energy 변화 두 기준을 함께 보는 것이 안전함.\n\n## Connections\n\n- [[kohn-sham-equations]] — self-consistency가 필요한 이유\n- [[k-point-sampling]] — smearing과 k-grid가 금속 SCF 안정성에 주는 영향\n- [[finite-bias-iv-curves]] — bias를 걸었을 때 SCF가 어려워지는 이유\n\n## Refs\n\n- P. Pulay, Chem. Phys. Lett. 73, 393 (1980).\n- G. P. Kerker, Phys. Rev. B 23, 3082 (1981).\n- D. D. Johnson, Phys. Rev. B 38, 12807 (1988).", "# DFT Band-Gap Underestimation\n\nLDA·GGA의 Kohn-Sham gap은 측정되는 준입자 gap(IP − EA)보다 작으며 이 오차는 functional 근사와 Kohn-Sham eigenvalue의 해석 두 곳에서 나옴.\n\n## Summary\n\n- 준입자 gap = IP − EA = Kohn-Sham gap + derivative discontinuity Δ_xc.\n- semilocal functional은 Δ_xc가 0이고 self-interaction error가 있어 gap을 작게 줌.\n- 분자에서는 −ε_HOMO가 IP보다 작게 나와 HOMO가 너무 높게 놓임.\n\n## Details\n\n전자 수 N에 대한 exact 에너지 E(N)은 정수 N 사이에서 직선이고 정수점에서 기울기가 꺾임. 이 꺾임 때문에 exact functional에서도 xc 퍼텐셜이 정수 N을 지날 때 상수 Δ_xc만큼 뜀(Perdew-Levy, Sham-Schlüter). Kohn-Sham gap에 Δ_xc를 더해야 준입자 gap이 됨 ([[kohn-sham-equations]]).\n\nLDA와 GGA의 E(N)은 정수 사이에서 아래로 볼록하게 휘어 Δ_xc를 0으로 만들고 전자가 자기 자신과 상호작용하는 self-interaction error 때문에 점유 준위가 위로 올라감. 결과적으로 −ε_HOMO는 IP보다 작고 LUMO는 EA 기준보다 낮게 놓임 ([[exchange-correlation-functionals]]).\n\n준입자 gap을 직접 계산하려면 GW 근사가 표준이고 분자 기체상에서는 ΔSCF 방식으로 IP = E(N−1) − E(N), EA = E(N) − E(N+1)을 total energy 차이로 구할 수 있음.\n\n분자 접합에서는 이 오차가 HOMO와 LUMO를 E_F 쪽으로 끌어당겨 transmission resonance가 E_F에 너무 가깝게 놓임. 그 결과 zero-bias conductance가 과대평가되기 쉬움 ([[transmission-function-interpretation]]). 전극 표면의 polarization은 이와 반대로 실제 gap을 줄이는데, semilocal DFT는 이 효과도 담지 못함. 두 효과를 함께 다루는 보정이 [[dft-sigma-level-correction]]임.\n\n## Connections\n\n- [[dft-sigma-level-correction]] — 이 오차를 transport 계산에서 보정하는 방법\n- [[transmission-function-interpretation]] — 준위 오차가 T(E_F)에 주는 영향\n- [[exchange-correlation-functionals]] — self-interaction error의 출처\n- [[kohn-sham-equations]] — eigenvalue 해석의 한계\n\n## Refs\n\n- J. P. Perdew and M. Levy, Phys. Rev. Lett. 51, 1884 (1983).\n- L. J. Sham and M. Schlüter, Phys. Rev. Lett. 51, 1888 (1983).\n- M. S. Hybertsen and S. G. Louie, Phys. Rev. B 34, 5390 (1986).", "# Basis Sets: Numerical Atomic Orbitals\n\nnumerical atomic orbital(NAO)은 원자 중심의 유한 범위 함수로, Hamiltonian을 sparse하게 만들어 큰 계와 [[negf-landauer-formula]] 기반 transport 계산을 가능하게 함.\n\n## Summary\n\n- 각 orbital은 radial 함수와 spherical harmonic의 곱이며 cutoff radius 밖에서 정확히 0임.\n- single-ζ(SZ) → double-ζ(DZ) → DZ + polarization(DZP)으로 basis를 키움.\n- 원자 중심 basis이므로 basis set superposition error(BSSE)와 Pulay force가 생김.\n\n## Details\n\nradial 함수는 confinement 조건 아래 원자 문제를 풀어 얻음. confinement를 정하는 기준으로 energy shift를 쓰며 값이 작을수록 orbital 범위가 길어져 정확도와 비용이 함께 올라감. 두 번째 ζ는 split-valence 방식으로 만들고 polarization orbital은 각운동량이 하나 더 높은 함수를 추가함.\n\n국소 basis에서는 Hamiltonian H와 overlap S가 이웃 원자 사이에서만 0이 아니므로 device를 주층(principal layer) 단위로 나누기 쉬움. 이 구조 덕분에 [[electrode-self-energy]] 계산과 Green function 역행렬 계산이 효율적임.\n\nbasis가 원자를 따라 움직이므로 힘 계산에 Pulay 항이 들어감. 분자 흡착 에너지처럼 두 조각의 에너지를 빼는 경우 BSSE가 결합을 과대평가하므로 counterpoise 보정을 고려함.\n\norbital이 원자에 붙어 있다는 점은 분석에도 유리함. [[pdos-projection]]과 [[eigenchannel-analysis]]는 basis 지표를 원자와 orbital 종류로 바로 묶어 해석함. 반대로 basis 완전성을 [[plane-wave-cutoff-convergence]]처럼 숫자 하나로 수렴시킬 수는 없음.\n\n## Connections\n\n- [[pdos-projection]] — orbital 지표를 원자·각운동량별로 묶는 분석\n- [[electrode-self-energy]] — sparse H, S가 전극 계산을 효율화함\n- [[plane-wave-cutoff-convergence]] — 체계적 수렴이 가능한 plane-wave basis와의 대비\n- [[pseudopotentials]] — 원소별 basis와 짝을 이루는 퍼텐셜\n\n## Refs\n\n- J. M. Soler et al., J. Phys.: Condens. Matter 14, 2745 (2002).\n- J. Junquera, Ó. Paz, D. Sánchez-Portal, and E. Artacho, Phys. Rev. B 64, 235111 (2001).\n- S. F. Boys and F. Bernardi, Mol. Phys. 19, 553 (1970).", "# k-Point Sampling\n\n주기계의 density와 total energy는 Brillouin zone(BZ) 적분이며 유한한 k-point grid의 수렴은 cutoff와 별도로 확인해야 함.\n\n## Summary\n\n- Monkhorst-Pack grid는 BZ를 균일하게 나눈 특수 점 집합임.\n- 절연체는 성긴 grid로도 수렴이 빠르고 금속은 Fermi surface 때문에 촘촘한 grid가 필요함.\n- 금속에서는 electronic smearing을 함께 써서 occupation의 불연속을 완화함.\n\n## Details\n\nBloch 정리에 따라 Kohn-Sham orbital은 k로 표지되고 ([[kohn-sham-equations]]), 물리량은 BZ 평균으로 계산됨. Monkhorst-Pack 방식은 역격자 방향마다 n개의 점을 균일하게 배치하고 대칭으로 기약 점만 남김.\n\ngrid 크기는 실공간 cell 길이에 반비례하게 잡음. 긴 축은 적은 점으로 충분하고 vacuum이 들어간 비주기 방향은 1점(Γ)만 씀. 1D 나노와이어라면 와이어 축 방향만 여러 점을 쓰고 나머지 두 방향은 1점으로 둠.\n\n금속에서는 Fermi 준위를 지나는 band 때문에 적분 피적분함수가 불연속임. Methfessel-Paxton, Fermi-Dirac 등의 smearing으로 이 불연속을 매끄럽게 하며 smearing 폭과 k-grid는 함께 수렴시켜야 함. 성긴 grid는 SCF 수렴도 늦출 수 있음 ([[2026-01-lab-notes-scf]], [[scf-mixing-convergence]]).\n\ntransport 계산에서는 전극 방향과 수직 방향의 k-point가 서로 다른 역할을 하므로 별도 규칙이 있음 ([[kpoints-in-transport-direction]]).\n\n## Connections\n\n- [[plane-wave-cutoff-convergence]] — 함께 수렴시켜야 하는 다른 수치 축\n- [[kpoints-in-transport-direction]] — 전극·device 계산에서 방향별 설정\n- [[scf-mixing-convergence]] — 금속의 SCF 안정성과 연결\n- [[electrode-self-energy]] — 수직 방향 k-point가 self-energy 계산에 들어가는 방식\n\n## Refs\n\n- H. J. Monkhorst and J. D. Pack, Phys. Rev. B 13, 5188 (1976).\n- M. Methfessel and A. T. Paxton, Phys. Rev. B 40, 3616 (1989).", "# DFT+Σ Level Correction\n\nNeaton, Hybertsen, Louie(2006)는 금속 표면 근처 분자의 준입자 gap이 기체상보다 작아지는 것을 보였고 이 아이디어를 semilocal DFT 분자 준위에 적용하는 보정이 DFT+Σ임.\n\n## Summary\n\n- 1단계 (기체상 보정): 점유 준위를 −IP에, 비점유 준위를 −EA에 맞추도록 이동함.\n- 2단계 (image-charge 보정): 전극 polarization이 gap을 줄이는 양을 고전 image-charge 모형으로 추정해 되돌림.\n- 결과적으로 HOMO는 내려가고 LUMO는 올라가 resonance가 E_F에서 멀어짐.\n\n## Details\n\nsemilocal DFT는 기체상 분자의 gap을 작게 줌 ([[dft-band-gap-underestimation]]). 1단계에서는 기체상 계산으로 IP와 EA를 따로 구하고 (ΔSCF 또는 GW), HOMO에 Σ_occ = −IP − ε_HOMO, LUMO에 Σ_unocc = −EA − ε_LUMO 크기의 shift를 줌.\n\n분자가 금속 표면에 가까워지면 전자를 더하거나 뺀 상태가 금속의 image charge로 안정화됨. 이 효과는 점유 준위를 올리고 비점유 준위를 내려 gap을 줄임. 점전하가 완전 도체 평면에서 거리 d만큼 떨어져 있을 때 image 상호작용 에너지는 e²/(16πε0 d)이고 분자에서는 이 값을 분자 전하 분포와 image plane 위치로 계산함. 2단계는 이 양만큼 1단계 shift를 되돌림.\n\n실제 구현에서는 분자 orbital에 projector를 걸어 Kohn-Sham Hamiltonian의 분자 블록에 shift를 더한 뒤 transmission을 다시 계산함 ([[negf-landauer-formula]]). 보정량은 image plane 위치와 분자-전극 거리에 민감하므로, 그 선택 근거와 흡착 기하 ([[van-der-waals-corrections]])를 함께 기록해야 함. 세미나 메모 [[2026-03-seminar-notes-level-alignment]]에 절차를 정리함.\n\n보정 후 T(E)를 보정 전과 같은 축에 겹쳐 resonance가 얼마나 이동했는지 확인함 ([[transmission-function-interpretation]]).\n\n## Connections\n\n- [[dft-band-gap-underestimation]] — 보정이 필요한 원인\n- [[transmission-function-interpretation]] — 보정 결과를 T(E)에서 읽는 법\n- [[van-der-waals-corrections]] — 흡착 거리가 image-charge 보정량을 정함\n- [[pdos-projection]] — 보정 전후 분자 준위 위치 확인\n\n## Refs\n\n- J. B. Neaton, M. S. Hybertsen, and S. G. Louie, Phys. Rev. Lett. 97, 216405 (2006).\n- S. Y. Quek et al., Nano Lett. 7, 3477 (2007).", "# PDOS Projection\n\nprojected density of states(PDOS)는 각 eigenstate의 weight를 basis orbital에 나눠 담은 DOS이며 원자 중심 basis에서는 원자·각운동량별 합으로 바로 얻음.\n\n## Summary\n\n- 비직교 basis에서는 overlap S를 고려한 Mulliken 방식으로 weight를 나눔.\n- 원소별, 원자별, 각운동량(s, p, d)별로 합쳐 그림.\n- 접합 계산에서는 device 영역 Green function에서 분자 원자만 골라 PDOS를 얻음.\n\n## Details\n\n주기계에서 orbital μ의 PDOS는 band와 k에 대한 합 Σ_nk Re[c*_μnk (S c_nk)_μ] δ(E − ε_nk)로 쓸 수 있음. 모든 μ를 더하면 전체 DOS가 됨. 비직교 basis의 overlap 항을 반씩 나누는 Mulliken 방식은 단순하지만 basis에 따라 값이 달라지므로, 절대값보다 에너지 위치와 상대 비중을 비교하는 용도로 씀 ([[basis-sets-numerical-atomic-orbitals]]).\n\nδ 함수는 Gaussian 또는 Lorentzian broadening으로 대체함. broadening 폭은 그림의 모양을 바꾸므로 비교하는 그림끼리 같은 값을 씀. 수렴된 [[k-point-sampling]] 위에서 계산해야 함.\n\nNEGF 접합에서는 device Green function으로 PDOS_μ(E) = −(1/π) Im[G S]_μμ를 계산함. 분자 원자의 PDOS peak를 T(E)와 같은 에너지 축(E − E_F)에 겹치면 각 transmission resonance가 어떤 분자 orbital에서 오는지 판정할 수 있음 ([[transmission-function-interpretation]]). PDOS peak가 있는데 T(E) peak가 없으면 전극과 약하게 결합한 국소 상태일 가능성이 있으며 [[eigenchannel-analysis]]로 교차 확인함.\n\n[[dft-sigma-level-correction]]을 적용했다면 보정 전후 분자 PDOS peak 위치를 함께 보고해 shift가 의도대로 들어갔는지 확인함.\n\n## Connections\n\n- [[transmission-function-interpretation]] — PDOS와 T(E)를 겹쳐 peak 기원 판정\n- [[eigenchannel-analysis]] — orbital 기원의 교차 확인\n- [[basis-sets-numerical-atomic-orbitals]] — Mulliken 분할이 basis에 의존하는 이유\n- [[dft-sigma-level-correction]] — 보정 shift 확인\n\n## Refs\n\n- R. S. Mulliken, J. Chem. Phys. 23, 1833 (1955).\n- M. Brandbyge, J.-L. Mozos, P. Ordejón, J. Taylor, and K. Stokbro, Phys. Rev. B 65, 165401 (2002).", "# Finite-Bias I-V Curves\n\nbias V를 걸면 두 전극의 화학 퍼텐셜이 eV만큼 벌어지고 device의 density와 Hamiltonian이 함께 바뀌므로 T(E)는 V마다 다시 계산해야 함.\n\n## Summary\n\n- 전류: I(V) = (2e/h) ∫ T(E, V) [f_L(E) − f_R(E)] dE.\n- 적분은 사실상 bias window [μ_R, μ_L] 안의 T(E, V)만 기여함 (저온 극한).\n- density는 equilibrium contour 적분과 bias window의 non-equilibrium 적분을 합쳐 구함.\n\n## Details\n\n0 bias에서는 density를 복소 에너지 평면의 contour 적분으로 효율적으로 계산함. 유한 bias에서는 μ_R과 μ_L 사이 에너지 구간에서 occupation이 전극마다 달라 실수 축 근처 적분이 추가로 필요함. 이 구간은 Green function이 날카로운 구조를 가져 촘촘한 에너지 grid가 필요함 ([[negf-landauer-formula]]).\n\nbias에 따른 퍼텐셜 강하는 Poisson 방정식으로 self-consistent하게 정해짐. 전극 경계에서 퍼텐셜이 bulk 값으로 돌아오도록 device 버퍼 층을 충분히 넣어야 함 ([[electrode-self-energy]]).\n\n표준 절차는 다음과 같음.\n\n1. 0 V 계산을 수렴시키고 density matrix를 저장함.\n2. 작은 bias 간격으로 V를 올리며 직전 bias의 density matrix를 초기값으로 씀.\n3. 각 bias에서 T(E, V)를 구하고 bias window에서 적분해 I를 얻음.\n\nbias가 커질수록 SCF 수렴이 어려워지므로 mixing weight를 낮추는 조정이 자주 필요함 ([[scf-mixing-convergence]], [[2026-01-lab-notes-scf]]). 결과를 해석할 때는 resonance가 bias window 안에 들어오는 bias에서 전류가 빠르게 늘어나는지 보고 그 resonance의 정체를 [[transmission-function-interpretation]]과 [[pdos-projection]]으로 확인함. 준위 위치 오차가 있으면 전류가 오르는 bias도 틀리므로 [[dft-sigma-level-correction]]의 영향을 함께 고려함.\n\n## Connections\n\n- [[negf-landauer-formula]] — 전류 공식의 출처\n- [[scf-mixing-convergence]] — 유한 bias SCF의 수렴 전략\n- [[transmission-function-interpretation]] — bias window 안 resonance 해석\n- [[dft-sigma-level-correction]] — 준위 오차가 I-V에 주는 영향\n\n## Refs\n\n- M. Brandbyge, J.-L. Mozos, P. Ordejón, J. Taylor, and K. Stokbro, Phys. Rev. B 65, 165401 (2002).\n- J. Taylor, H. Guo, and J. Wang, Phys. Rev. B 63, 245407 (2001).\n- S. Datta, Electronic Transport in Mesoscopic Systems (Cambridge University Press, 1995).", "# Eigenchannel Analysis\n\ntransmission 행렬 t†t의 eigenvalue τ_n은 각 채널의 투과율이고 합 Σ_n τ_n이 T(E)임. eigenvector는 해당 채널의 산란 상태를 실공간에 그릴 수 있게 함.\n\n## Summary\n\n- T(E) = Tr[t†t] = Σ_n τ_n, 0 ≤ τ_n ≤ 1.\n- 소수의 채널이 T(E)를 지배하는 경우가 많아, 몇 개 채널만 보면 수송 경로를 알 수 있음.\n- 채널 파동함수의 orbital 성분과 위상으로 어떤 분자 orbital이 수송을 담당하는지 판정함.\n\n## Details\n\n[[negf-landauer-formula]]의 Γ_L G Γ_R G† 형태는 한 에너지에서 Hermitian 행렬로 바꿔 대각화할 수 있음. Paulsson과 Brandbyge의 방법은 왼쪽 전극에서 들어오는 산란 상태 공간(spectral function A_L = G Γ_L G†)을 먼저 구하고 그 공간에서 Γ_R을 대각화해 eigenchannel을 얻음.\n\n채널 수의 상한은 가장 좁은 단면의 orbital 수가 정함. 예를 들어 단일 원자 금속 접점은 valence orbital 개수만큼의 채널만 가질 수 있고 분자 접합은 보통 한두 채널이 지배적임.\n\n해석 절차는 다음과 같음.\n\n1. T(E)의 관심 peak 또는 E_F에서 τ_n 목록을 구함 ([[transmission-function-interpretation]]).\n2. 지배적 채널의 파동함수를 실공간 grid에 그림.\n3. 분자 위의 lobe 모양을 분자 orbital과 비교하고 [[pdos-projection]]의 원자·orbital 성분과 대조함.\n\n국소 basis에서는 채널 eigenvector가 orbital 계수로 바로 나오므로 원자별 기여를 쉽게 읽을 수 있음 ([[basis-sets-numerical-atomic-orbitals]]).\n\n## Connections\n\n- [[transmission-function-interpretation]] — 채널 분해의 대상인 T(E)\n- [[pdos-projection]] — 같은 에너지에서 orbital 성분 교차 확인\n- [[basis-sets-numerical-atomic-orbitals]] — orbital 계수로 채널을 읽는 근거\n- [[negf-landauer-formula]] — t†t의 출처\n\n## Refs\n\n- M. Paulsson and M. Brandbyge, Phys. Rev. B 76, 115117 (2007).\n- S. Datta, Electronic Transport in Mesoscopic Systems (Cambridge University Press, 1995).", "# Interpreting the Transmission Function\n\n약하게 결합된 분자 접합의 T(E)는 분자 orbital마다 하나씩 Lorentzian 모양 resonance를 보이며 zero-bias conductance는 E_F에서 그 꼬리의 높이로 정해짐.\n\n## Summary\n\n- peak 위치 ≈ 전극 결합으로 이동된 분자 준위 (HOMO, LUMO 등).\n- peak 폭 ≈ Γ_L + Γ_R, 분자와 두 전극의 coupling 세기.\n- E_F가 HOMO-LUMO gap 안에 있으면 conductance는 가까운 resonance의 꼬리가 정함 (off-resonant tunneling).\n\n## Details\n\n단일 준위 모형에서 T(E) = Γ_L Γ_R / [(E − ε0)² + ((Γ_L + Γ_R)/2)²]임. 대칭 결합(Γ_L = Γ_R)이면 peak 높이가 1이고 비대칭이면 1보다 낮아짐. 이 모형은 [[negf-landauer-formula]]의 일반식을 준위 하나와 에너지 무관한 Γ로 줄인 것임.\n\nE_F가 gap 안에 있으면 T(E_F)는 대략 Γ²/(E_F − ε0)²에 비례함. 준위가 E_F에 얼마나 가까운지가 conductance를 크게 좌우함. semilocal DFT는 분자 준위를 E_F에 너무 가깝게 놓는 경향이 있어 T(E_F)를 과대평가하기 쉬움 ([[dft-band-gap-underestimation]]). 이를 보정한 뒤 resonance가 E_F로부터 멀어지는지 확인하는 것이 [[dft-sigma-level-correction]]의 목적임.\n\n어느 orbital이 어떤 peak를 만드는지는 T(E)만으로는 알 수 없음. 같은 에너지 축에서 분자 [[pdos-projection]]을 겹쳐 보거나, [[eigenchannel-analysis]]로 채널의 공간 분포를 그려 확인함.\n\npeak 폭은 분자-전극 거리와 anchoring 기하에 민감하므로 relaxation 조건 ([[van-der-waals-corrections]])을 함께 기록함. 여러 자릿수에 걸친 T(E)는 log 축으로 그려야 꼬리와 peak를 함께 볼 수 있음.\n\n## Connections\n\n- [[negf-landauer-formula]] — T(E)의 정의와 계산식\n- [[dft-sigma-level-correction]] — peak 위치를 보정하는 방법\n- [[pdos-projection]] — peak의 orbital 기원 확인\n- [[eigenchannel-analysis]] — peak를 채널별로 공간 분해\n- [[electrode-self-energy]] — 폭을 정하는 Γ의 출처\n\n## Refs\n\n- S. Datta, Electronic Transport in Mesoscopic Systems (Cambridge University Press, 1995).\n- J. C. Cuevas and E. Scheer, Molecular Electronics: An Introduction to Theory and Experiment (World Scientific, 2010).", "# Electrode Self-Energy\n\n반무한 전극은 직접 다룰 수 없으므로, 전극의 surface Green function으로 self-energy Σ_α(E)를 만들어 device Hamiltonian의 경계 블록에 더함.\n\n## Summary\n\n- Σ_α(E) = (ES_dα − H_dα) g_α(E) (ES_αd − H_αd), g_α는 전극 surface Green function.\n- g_α는 주층(principal layer)을 반복 결합하는 decimation 방식으로 구함 (Lopez Sancho 등).\n- 전극 H와 S는 별도의 bulk 전극 계산에서 가져오므로 전극 계산과 device 계산의 설정이 일관되어야 함.\n\n## Details\n\n전극은 transport 방향으로 같은 주층이 반복된다고 가정함. 주층은 가장 가까운 이웃 주층하고만 결합하도록 충분히 길게 잡아야 함. 국소 basis에서는 orbital 범위가 유한하므로 이 조건을 맞추기 쉬움 ([[basis-sets-numerical-atomic-orbitals]]).\n\nsurface Green function은 decimation 반복으로 주층 개수를 두 배씩 늘려 가며 수렴시킴. 수렴은 E에 작은 허수부 η를 더한 E + iη에서 계산하며 η는 수치 안정성용 broadening임.\n\nΣ의 허수부에서 broadening Γ_α = i(Σ_α − Σ_α†)가 나오며 이는 [[negf-landauer-formula]]의 T(E) 공식에 직접 들어감. Γ가 크면 분자 준위가 전극과 강하게 결합해 넓은 peak를 만듦 ([[transmission-function-interpretation]]).\n\ntransport 방향에 수직인 방향이 주기적이면 Σ는 수직 k마다 따로 계산하고 transport 방향 k는 surface Green function 계산에 이미 적분되어 있음. 전극 bulk 계산에서는 transport 방향 k-point를 촘촘히 잡아야 함 ([[kpoints-in-transport-direction]]).\n\ndevice 영역은 전극 쪽 버퍼 층을 충분히 포함해 경계에서 퍼텐셜이 bulk 전극 값으로 돌아오게 해야 함. 이 조건이 깨지면 경계에서 인공적인 산란이 생김.\n\n## Connections\n\n- [[negf-landauer-formula]] — Σ와 Γ가 들어가는 공식\n- [[kpoints-in-transport-direction]] — 전극 계산의 k-point 규칙\n- [[k-point-sampling]] — 수직 방향 k 평균의 일반 원리\n- [[transmission-function-interpretation]] — Γ가 peak 폭을 정함\n\n## Refs\n\n- M. P. Lopez Sancho, J. M. Lopez Sancho, and J. Rubio, J. Phys. F 15, 851 (1985).\n- M. Brandbyge, J.-L. Mozos, P. Ordejón, J. Taylor, and K. Stokbro, Phys. Rev. B 65, 165401 (2002).\n- S. Datta, Electronic Transport in Mesoscopic Systems (Cambridge University Press, 1995).", "# NEGF and the Landauer Formula\n\ncoherent 수송 영역에서 전류는 전극 사이 에너지별 transmission T(E)의 적분이며 NEGF는 T(E)를 device Green function으로 계산하는 틀임.\n\n## Summary\n\n- 계를 left electrode / device(scattering region) / right electrode로 나눔.\n- retarded Green function: G(E) = [ES − H − Σ_L(E) − Σ_R(E)]⁻¹.\n- transmission: T(E) = Tr[Γ_L G Γ_R G†], Γ_α = i(Σ_α − Σ_α†).\n- 0 bias, 저온 conductance: G = G0 T(E_F), G0 = 2e²/h (spin 축퇴 포함).\n\n## Details\n\n반무한 전극의 영향은 [[electrode-self-energy]] Σ_L, Σ_R로 device 부분 행렬에 들어감. Σ의 실수부는 device 준위를 이동시키고 허수부에서 나오는 Γ는 준위의 broadening(전극으로 빠져나가는 비율)을 나타냄.\n\n유한 bias V에서 전류는 Landauer-Büttiker 공식 I = (2e/h) ∫ T(E, V) [f_L(E) − f_R(E)] dE로 계산함. f_L과 f_R은 각 전극의 화학 퍼텐셜 μ_L, μ_R을 가진 Fermi 분포이고 μ_L − μ_R = eV임. 계산 절차와 bias window의 의미는 [[finite-bias-iv-curves]]에 정리함.\n\n이 공식은 전자가 device 안에서 위상을 잃지 않는 coherent, elastic 수송을 가정함. 전자-포논 산란이나 강한 전자 상관은 별도 self-energy가 필요하며 이 노트의 범위 밖임.\n\nDFT-NEGF에서 H는 Kohn-Sham Hamiltonian이므로, T(E)의 peak 위치는 Kohn-Sham 준위의 오차를 그대로 물려받음 ([[dft-band-gap-underestimation]]). 계산 자체는 [[basis-sets-numerical-atomic-orbitals]]처럼 국소 basis에서 효율적임. 읽기 메모 [[2026-02-reading-notes-negf]]에 유도 과정을 정리함.\n\n## Connections\n\n- [[electrode-self-energy]] — Σ와 Γ의 계산 방법\n- [[transmission-function-interpretation]] — 계산된 T(E) 읽는 법\n- [[finite-bias-iv-curves]] — bias window 적분으로 전류 계산\n- [[kpoints-in-transport-direction]] — 전극과 device 계산의 k-point 규칙\n\n## Refs\n\n- R. Landauer, IBM J. Res. Dev. 1, 223 (1957).\n- C. Caroli, R. Combescot, P. Nozières, and D. Saint-James, J. Phys. C 4, 916 (1971).\n- M. Büttiker, Phys. Rev. Lett. 57, 1761 (1986).\n- Y. Meir and N. S. Wingreen, Phys. Rev. Lett. 68, 2512 (1992).\n- S. Datta, Electronic Transport in Mesoscopic Systems (Cambridge University Press, 1995).\n- M. Brandbyge, J.-L. Mozos, P. Ordejón, J. Taylor, and K. Stokbro, Phys. Rev. B 65, 165401 (2002).", "# k-Points in the Transport Direction\n\nDFT-NEGF 계산의 k-point 설정은 방향마다 역할이 다르며 전극 계산·device 계산·transmission 계산을 서로 맞춰야 함.\n\n## Summary\n\n- 전극 bulk 계산: transport 방향은 주기적이므로 촘촘한 k-grid로 Hamiltonian을 수렴시킴.\n- device(scattering region) 계산: transport 방향은 open boundary라 k-point 1점만 씀.\n- 수직 방향: 전극과 device가 같은 수직 k-grid를 써야 함.\n\n## Details\n\n전극은 transport 방향으로 무한히 반복되는 bulk 결정이므로, 일반적인 [[k-point-sampling]] 원리대로 그 방향의 BZ 적분을 수렴시켜야 함. 전극 주층이 짧을수록 그 방향 역격자가 길어져 더 많은 k-point가 필요함. 금속 전극은 Fermi surface 때문에 수렴이 특히 느림.\n\ndevice 계산에서는 transport 방향의 무한성이 [[electrode-self-energy]]로 들어가므로, 같은 방향 k-point를 여러 개 쓰는 것은 의미가 없음. 그 방향은 1로 고정함.\n\ntransport 방향에 수직인 방향이 주기적인 slab 전극이면 수직 k-grid는 전극과 device에서 같아야 Σ(k⊥)와 device H(k⊥)가 같은 k⊥에서 결합됨. transmission은 k⊥별로 계산한 T(E, k⊥)를 평균해서 얻으며 transmission 계산용 k⊥ grid는 SCF용보다 더 촘촘하게 잡는 경우가 많음.\n\n1D 나노와이어 전극은 수직 두 방향이 vacuum이므로 k⊥는 Γ 1점이고 와이어 축 방향만 전극 계산에서 여러 점을 씀. 이 경우 k-point 문제는 전극 bulk 수렴 하나로 줄어듦 ([[proj-example-nanowire-transport]]).\n\n## Connections\n\n- [[k-point-sampling]] — BZ 적분 수렴의 일반 원리\n- [[electrode-self-energy]] — transport 방향 무한성이 들어가는 자리\n- [[negf-landauer-formula]] — k⊥ 평균 transmission이 들어가는 공식\n- [[proj-example-nanowire-transport]] — 1D 전극에서 설정이 단순해지는 예\n\n## Refs\n\n- M. Brandbyge, J.-L. Mozos, P. Ordejón, J. Taylor, and K. Stokbro, Phys. Rev. B 65, 165401 (2002).\n- N. Papior, N. Lorente, T. Frederiksen, A. García, and M. Brandbyge, Comput. Phys. Commun. 212, 8 (2017).\n- H. J. Monkhorst and J. D. Pack, Phys. Rev. B 13, 5188 (1976).", "# Example Project: Nanowire-Molecule Junction Transport\n\n가상의 학습 프로젝트. 두 개의 반무한 1D 금속 나노와이어 전극 사이에 작은 유기 분자를 끼운 접합에서 T(E)와 I-V를 계산하는 절차를 익힘. 결과 수치는 기록하지 않음.\n\n## Summary\n\n- 목표: DFT-NEGF 계산의 각 단계를 순서대로 수행하고 단계마다 어떤 수렴·보정을 점검하는지 익힘.\n- 구성: 1D 전극 bulk → 기체상 분자 → 접합 relaxation → 0 V transport → 분석 → 준위 보정 → 유한 bias.\n- 필요 개념: [[moc-dft-basics]], [[moc-quantum-transport]].\n\n## Details\n\n1. **전극 bulk 계산**: 와이어 축 방향 k-grid와 basis·mesh 수렴을 확인함 ([[kpoints-in-transport-direction]], [[basis-sets-numerical-atomic-orbitals]], [[plane-wave-cutoff-convergence]]). SCF가 진동하면 [[scf-mixing-convergence]]를 참고함.\n2. **기체상 분자 계산**: 같은 functional과 [[pseudopotentials]]로 분자를 relax하고 ΔSCF로 IP와 EA를 구함 ([[dft-band-gap-underestimation]]).\n3. **접합 구조 relaxation**: 분자와 양쪽 전극 끝 원자를 relax하고 dispersion 보정 여부를 기록함 ([[van-der-waals-corrections]]).\n4. **0 V transport 계산**: 전극 [[electrode-self-energy]]를 붙여 device density를 수렴시키고 T(E)를 구함 ([[negf-landauer-formula]]).\n5. **분석**: T(E)를 log 축으로 그리고 분자 [[pdos-projection]]과 [[eigenchannel-analysis]]로 peak의 orbital 기원을 판정함 ([[transmission-function-interpretation]]).\n6. **준위 보정**: 2단계의 IP/EA와 image-charge 모형으로 [[dft-sigma-level-correction]]을 적용하고 보정 전후 T(E)를 비교함.\n7. **유한 bias**: 0 V density matrix에서 시작해 bias를 단계적으로 올리며 I-V를 계산함 ([[finite-bias-iv-curves]]).\n\n참고 원본 메모: [[2026-01-lab-notes-scf]], [[2026-02-reading-notes-negf]], [[2026-03-seminar-notes-level-alignment]].\n\n## Connections\n\n- [[moc-quantum-transport]] — transport 개념 목차\n- [[moc-dft-basics]] — DFT 기초 목차\n- [[kpoints-in-transport-direction]] — 1D 전극에서 k-point 설정\n- [[dft-sigma-level-correction]] — 6단계 보정의 근거\n- [[finite-bias-iv-curves]] — 7단계 절차\n\n## Refs\n\n- M. Brandbyge, J.-L. Mozos, P. Ordejón, J. Taylor, and K. Stokbro, Phys. Rev. B 65, 165401 (2002).\n- J. B. Neaton, M. S. Hybertsen, and S. G. Louie, Phys. Rev. Lett. 97, 216405 (2006).\n- S. Datta, Electronic Transport in Mesoscopic Systems (Cambridge University Press, 1995).", "# MOC: DFT Basics\n\n- [[kohn-sham-equations]] — 상호작용 전자 문제를 비상호작용 보조계로 바꾸는 출발점\n- [[exchange-correlation-functionals]] — LDA·GGA·hybrid 근사의 위계와 한계\n- [[pseudopotentials]] — core 전자를 제거하는 유효 퍼텐셜\n- [[plane-wave-cutoff-convergence]] — plane-wave basis 크기의 수렴 판정\n- [[basis-sets-numerical-atomic-orbitals]] — 국소 basis(NAO)의 구성과 BSSE\n- [[k-point-sampling]] — Brillouin zone 적분과 Monkhorst-Pack grid\n- [[scf-mixing-convergence]] — SCF 반복의 mixing 전략\n- [[van-der-waals-corrections]] — 분산 상호작용 보정(D2, D3, vdW-DF)\n- [[dft-band-gap-underestimation]] — Kohn-Sham gap이 준입자 gap보다 작은 이유\n- [[pdos-projection]] — 전체 DOS를 원자·orbital 성분으로 나누는 방법", "# MOC: Quantum Transport\n\n- [[negf-landauer-formula]] — NEGF에서 Landauer 공식으로 가는 경로\n- [[electrode-self-energy]] — 반무한 전극을 유한 행렬로 접는 방법\n- [[kpoints-in-transport-direction]] — 전극·device 계산의 k-point 설정 규칙\n- [[transmission-function-interpretation]] — T(E)의 peak·폭·위치 해석\n- [[eigenchannel-analysis]] — transmission을 독립 채널로 분해\n- [[pdos-projection]] — 접합 내 분자 orbital 기여 확인\n- [[dft-sigma-level-correction]] — 분자 준위 정렬 보정(DFT+Σ)\n- [[finite-bias-iv-curves]] — 유한 bias에서 전류 계산\n- [[proj-example-nanowire-transport]] — 위 개념을 순서대로 적용하는 예시 프로젝트", "# Example Research Wiki\n\n교과서 수준의 DFT와 분자 접합 전자수송 지식을 담은 예시 vault. 개인 연구 내용·미발표 결과는 포함하지 않음.\n\n## Maps of Content\n\n- [DFT Basics](notes/moc-dft-basics.md)\n- [Quantum Transport](notes/moc-quantum-transport.md)\n\n## Project\n\n- [Example Project: Nanowire-Molecule Junction Transport](notes/proj-example-nanowire-transport.md)"]};

let NAMES = PLAIN ? PLAIN.names : null, TEXTS = PLAIN ? PLAIN.texts : null, SLUGS = PLAIN ? PLAIN.slugs : null;
let SLUGIDX = null;
function slugIndex() { if (!SLUGIDX && SLUGS) { SLUGIDX = {}; SLUGS.forEach((s, i) => SLUGIDX[s.toLowerCase()] = i); } return SLUGIDX; }
const LCOL = ["#ff8a65", "#7fd6a4", "#f3e3b8", "#8ecae6", "#ffffff"];   // per-layer hue
const N = DATA.deg.length;
const layerOf = new Int8Array(N), rankOf = new Int32Array(N);
DATA.layers.forEach((L, li) => L.nodes.forEach((n, r) => { layerOf[n] = li; rankOf[n] = r; }));
const adj = Array.from({ length: N }, () => []);
const fwd = Array.from({ length: N }, () => []);            // edges toward a higher layer
const E = DATA.links.map(([a, b], i) => {
  adj[a].push(i); adj[b].push(i);
  let s = a, t = b;
  if (layerOf[s] > layerOf[t]) [s, t] = [t, s];
  if (layerOf[s] !== layerOf[t]) fwd[s].push(i);
  return { s, t, same: layerOf[s] === layerOf[t] };
});

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const base = document.createElement("canvas"), bctx = base.getContext("2d");
let W, H, DPR, X = [], Y = new Float32Array(N), colTop = [], colBot = [], colX = [], stars = [];

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [cv, base]) { c.width = W * DPR; c.height = H * DPR; }
  const nl = DATA.layers.length, mx = Math.max(56, W * 0.08);
  const top = Math.max(96, H * 0.16), bot = H - Math.max(40, H * 0.07);
  DATA.layers.forEach((L, li) => {
    colX[li] = mx + (W - 2 * mx) * li / (nl - 1);
    const n = L.nodes.length, span = Math.min(bot - top, Math.max(0, n - 1) * 26);
    const t0 = (top + bot) / 2 - span / 2;
    colTop[li] = t0; colBot[li] = t0 + span;
    L.nodes.forEach((id, r) => { Y[id] = n > 1 ? t0 + span * r / (n - 1) : (top + bot) / 2; });
  });
  X = Array.from(layerOf, li => colX[li]);
  const R = rng(7); stars = [];
  const ns = Math.min(DATA.stars, 1400);
  for (let i = 0; i < ns; i++) stars.push([R() * W, R() * H, R() * 1.1 + 0.2, R() * 6.28]);
  drawBase();
}

function edgePath(c, e) {
  const xa = X[e.s], ya = Y[e.s], xb = X[e.t], yb = Y[e.t];
  c.moveTo(xa, ya);
  if (e.same) {
    const side = layerOf[e.s] < 2 ? -1 : 1, bulge = Math.min(140, 12 + Math.abs(ya - yb) * 0.32);
    c.bezierCurveTo(xa + side * bulge, ya, xb + side * bulge, yb, xb, yb);
  } else {
    const dx = (xb - xa) * 0.5;
    c.bezierCurveTo(xa + dx, ya, xb - dx, yb, xb, yb);
  }
}
function bez(e, t) {     // point on the edge curve at t in [0,1]
  const xa = X[e.s], ya = Y[e.s], xb = X[e.t], yb = Y[e.t];
  let c1x, c2x;
  if (e.same) { const side = layerOf[e.s] < 2 ? -1 : 1, b = Math.min(140, 12 + Math.abs(ya - yb) * 0.32); c1x = xa + side * b; c2x = xb + side * b; }
  else { const dx = (xb - xa) * 0.5; c1x = xa + dx; c2x = xb - dx; }
  const u = 1 - t;
  return [u*u*u*xa + 3*u*u*t*c1x + 3*u*t*t*c2x + t*t*t*xb, u*u*u*ya + 3*u*u*t*ya + 3*u*t*t*yb + t*t*t*yb];
}

function drawBase() {
  const c = bctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.75);
  g.addColorStop(0, "#121a33"); g.addColorStop(1, "#05070f");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // column frames + headers
  c.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
  DATA.layers.forEach((L, li) => {
    const x = colX[li], w = 26, t = colTop[li] - 16, b = colBot[li] + 16;
    c.strokeStyle = "rgba(160,180,220,.22)"; c.lineWidth = 1;
    c.beginPath(); c.roundRect ? c.roundRect(x - w / 2, t, w, b - t, 4) : c.rect(x - w / 2, t, w, b - t); c.stroke();
    if (W < 700) {
      c.fillStyle = "rgba(220,228,245,.85)";
      c.fillText(`NL${li}`, x - 12, t - 22); c.fillText(`${L.nodes.length}`, x - 12, t - 8);
      return;
    }
    const tx = Math.min(Math.max(x - 60, 8), W - c.measureText("Activation: link (click)").width - 12), ty = t - 46;
    c.fillStyle = "rgba(220,228,245,.85)"; c.fillText(`NL ${li}  ${L.name}`, tx, ty);
    c.fillText(`Neurons: ${L.nodes.length}`, tx, ty + 14);
    c.fillStyle = "#ff5a5a"; c.fillText(`Activation: link (click)`, tx, ty + 28);
  });
  // edges, additive glow
  c.globalCompositeOperation = "lighter";
  const dense = E.length > 2500 ? 0.55 : 1;
  for (const e of E) {
    const gr = c.createLinearGradient(X[e.s], Y[e.s], X[e.t], Y[e.t]);
    gr.addColorStop(0, LCOL[layerOf[e.s]]); gr.addColorStop(1, LCOL[layerOf[e.t]]);
    c.strokeStyle = gr; c.globalAlpha = (e.same ? 0.07 : 0.17) * dense; c.lineWidth = e.same ? 0.6 : 0.9;
    c.beginPath(); edgePath(c, e); c.stroke();
  }
  // neurons
  c.globalAlpha = 1;
  for (let i = 0; i < N; i++) {
    const r = 1.1 + Math.min(3.2, Math.sqrt(DATA.deg[i]) * 0.35);
    c.fillStyle = LCOL[layerOf[i]]; c.globalAlpha = 0.85;
    c.beginPath(); c.arc(X[i], Y[i], r, 0, 6.283); c.fill();
  }
  c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
}

// ---- forward-pass pulses ----
const pulses = [], flash = new Float32Array(N);
const seeds = [];
for (let i = 0; i < N; i++) if (layerOf[i] <= 1 && fwd[i].length) seeds.push(i);
function spawnFrom(n) {
  const out = fwd[n]; if (!out.length) return;
  pulses.push({ e: E[out[(Math.random() * out.length) | 0]], t: 0, v: 0.006 + Math.random() * 0.008 });
}

let hover = -1, selected = -1, last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last) / 16.7; last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(base, 0, 0, W, H);
  // stars
  ctx.fillStyle = "#dfe8ff";
  for (const s of stars) { ctx.globalAlpha = 0.25 + 0.25 * Math.sin(now * 0.0008 + s[3]); ctx.fillRect(s[0], s[1], s[2], s[2]); }
  ctx.globalAlpha = 1;
  // pulses
  const cap = REDUCED ? 20 : 260;
  if (pulses.length < cap && seeds.length) for (let k = 0; k < (REDUCED ? 1 : 4); k++) if (Math.random() < 0.5) spawnFrom(seeds[(Math.random() * seeds.length) | 0]);
  ctx.globalCompositeOperation = "lighter";
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += p.v * dt;
    if (p.t >= 1) { flash[p.e.t] = 1; if (Math.random() < 0.7) spawnFrom(p.e.t); pulses.splice(i, 1); continue; }
    const [x, y] = bez(p.e, p.t);
    ctx.fillStyle = LCOL[layerOf[p.e.t]]; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fill();
  }
  for (let i = 0; i < N; i++) if (flash[i] > 0.02) {
    ctx.globalAlpha = flash[i] * 0.7; ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(X[i], Y[i], 3 + 5 * flash[i], 0, 6.283); ctx.fill();
    flash[i] *= Math.pow(0.92, dt);
  }
  // highlight (butterfly)
  const h = selected >= 0 ? selected : hover;
  if (h >= 0) {
    ctx.globalAlpha = 0.85; ctx.lineWidth = 1.1; ctx.strokeStyle = "#f4f7ff";
    ctx.beginPath(); for (const ei of adj[h]) edgePath(ctx, E[ei]); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    for (const ei of adj[h]) { const o = E[ei].s === h ? E[ei].t : E[ei].s; ctx.beginPath(); ctx.arc(X[o], Y[o], 2.4, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(X[h], Y[h], 5, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

// ---- picking ----
function pick(mx, my) {
  let best = -1, bd = 14;
  DATA.layers.forEach((L, li) => {
    if (Math.abs(mx - colX[li]) > 16) return;
    for (const n of L.nodes) { const d = Math.abs(my - Y[n]); if (d < bd) { bd = d; best = n; } }
  });
  return best;
}
const tip = document.getElementById("tip");
const label = n => NAMES ? NAMES[n] : `NL ${layerOf[n]} · #${rankOf[n]} · links ${DATA.deg[n]}`;
if (!EMBED) {
  cv.addEventListener("mousemove", ev => {
    hover = pick(ev.clientX, ev.clientY);
    cv.style.cursor = hover >= 0 ? "pointer" : "default";
    if (hover >= 0) {
      tip.textContent = label(hover); tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 14, W - 350) + "px"; tip.style.top = (ev.clientY + 12) + "px";
    } else tip.style.display = "none";
  });
  cv.addEventListener("mouseleave", () => { hover = -1; tip.style.display = "none"; });
  cv.addEventListener("click", ev => { const n = pick(ev.clientX, ev.clientY); select(n); });
}
const panel = document.getElementById("panel"), pbody = document.getElementById("pbody");
document.getElementById("px").onclick = () => select(-1);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function select(n) {
  selected = n;
  if (n < 0) { panel.style.display = "none"; return; }
  const by = {};
  const seen = new Set();
  for (const ei of adj[n]) { const o = E[ei].s === n ? E[ei].t : E[ei].s; if (seen.has(o)) continue; seen.add(o); (by[layerOf[o]] ||= []).push(o); }
  let html = `<h3>${esc(label(n))}</h3><div class="meta">NL ${layerOf[n]} ${esc(DATA.layers[layerOf[n]].name)} · links ${DATA.deg[n]}</div>`;
  if (!NAMES) html += `<div class="meta">unlock to read titles</div>`;
  if (TEXTS && TEXTS[n]) {
    const si = slugIndex();
    const md = TEXTS[n].replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, t, lab) => {
      const j = si[t.trim().toLowerCase()];
      return j === undefined ? esc(lab || t) : `<a data-n="${j}">${esc(lab || t)}</a>`;
    });
    html += window.marked ? `<div class="body md">${marked.parse(md)}</div>` : `<div class="body">${esc(md)}</div>`;
  }
  if (TEXTS) html += `<div class="grp" style="margin-top:12px">linked notes</div>`;
  for (const li of Object.keys(by).sort()) {
    html += `<div class="grp">→ NL ${li} ${esc(DATA.layers[li].name)} (${by[li].length})</div>`;
    for (const o of by[li].slice(0, 60)) html += `<a data-n="${o}">${esc(label(o))}</a>`;
  }
  pbody.innerHTML = html; panel.style.display = "block"; panel.scrollTop = 0;
  pbody.querySelectorAll("a[data-n]").forEach(a => a.onclick = () => select(+a.dataset.n));
}

// ---- unlock (same scheme as /wiki-graph/) ----
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let pt = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(ENC.iv) }, key, b64d(ENC.ct)));
  if (ENC.gz) pt = new Uint8Array(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(pt));
}
const lockBtn = document.getElementById("lock"), box = document.getElementById("unlockbox");
const pw = document.getElementById("pw"), pwmsg = document.getElementById("pwmsg");
if (NAMES) lockBtn.textContent = "titles unlocked";
lockBtn.onclick = () => { if (NAMES) return; box.style.display = box.style.display === "block" ? "none" : "block"; pw.focus(); };
pw.addEventListener("keydown", async ev => {
  if (ev.key !== "Enter" || !ENC) return;
  pwmsg.textContent = "decrypting…";
  try { const d = await decrypt(pw.value); NAMES = d.names; TEXTS = d.texts || null; SLUGS = d.slugs || null; SLUGIDX = null; box.style.display = "none"; lockBtn.textContent = "titles unlocked"; if (selected >= 0) select(selected); }
  catch { pwmsg.textContent = "wrong password"; }
});

// embed card: cycle the butterfly highlight over well-connected neurons
if (EMBED || new URLSearchParams(location.search).has("demo")) {
  const hubs = [...Array(N).keys()].filter(i => DATA.deg[i] >= 12 && layerOf[i] >= 1 && layerOf[i] <= 2);
  let k = 0;
  const cycle = () => { if (hubs.length) hover = hubs[(k++ * 7919) % hubs.length]; };
  cycle(); setInterval(cycle, 2600);
}
addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(layout, 120); });
layout(); requestAnimationFrame(frame);
</script>
