<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.2}
      .t{font-size:15px;fill:#111}
      .s{font-size:12.5px;fill:#444}
      .h{font-size:13px;fill:#111;font-weight:bold;letter-spacing:.04em}
      .ln{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#ar)}
      .dash{stroke:#777;stroke-width:1.1;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="518" fill="#fff" stroke="#333" stroke-width="1"/>

  <!-- stage labels -->
  <text class="h" x="24" y="34">A. BUILD (once, then incremental)</text>
  <text class="h" x="24" y="284">B. ASK (every question, fully local)</text>
  <line x1="16" y1="262" x2="944" y2="262" stroke="#bbb" stroke-dasharray="3 4"/>

  <!-- A row -->
  <rect class="box" x="24" y="54" width="190" height="96" rx="6" style="stroke:#E69F00;stroke-width:2"/>
  <text class="t" x="36" y="80">Raw records</text>
  <text class="s" x="36" y="102">reports, STATUS, provenance,</text>
  <text class="s" x="36" y="120">site pages, meeting notes</text>
  <text class="s" x="36" y="138">(read-only)</text>

  <rect class="box" x="262" y="54" width="200" height="96" rx="6" style="stroke:#0072B2;stroke-width:2"/>
  <text class="t" x="274" y="80">LLM ingest agents</text>
  <text class="s" x="274" y="102">isolated workers → own staging;</text>
  <text class="s" x="274" y="120">one supervisor merges conflicts;</text>
  <text class="s" x="274" y="138">solo run kept as the control</text>

  <rect class="box" x="510" y="54" width="210" height="96" rx="6" style="stroke:#009E73;stroke-width:2"/>
  <text class="t" x="522" y="80">Markdown wiki (vault)</text>
  <text class="s" x="522" y="102">atomic notes + project hubs</text>
  <text class="s" x="522" y="120">+ MOC + Index, linked by</text>
  <text class="s" x="522" y="138">[[wikilinks]] (the graph)</text>

  <rect class="box" x="768" y="54" width="168" height="96" rx="6" style="stroke:#CC79A7;stroke-width:2"/>
  <text class="t" x="780" y="80">Checks</text>
  <text class="s" x="780" y="102">lint: broken links = 0</text>
  <text class="s" x="780" y="120">hub coverage, &lt;800 words</text>
  <text class="s" x="780" y="138">dedupe / split</text>

  <path class="ln" d="M214,102 H258"/>
  <path class="ln" d="M462,102 H506"/>
  <path class="ln" d="M720,102 H764"/>

  <rect class="box" x="510" y="178" width="210" height="60" rx="6" style="stroke:#56B4E9;stroke-width:2"/>
  <text class="t" x="522" y="203">Layered network view</text>
  <text class="s" x="522" y="223">build_neural.py → one HTML file</text>
  <path class="dash" d="M615,150 V174"/>

  <!-- B row -->
  <rect class="box" x="24" y="304" width="150" height="86" rx="6"/>
  <text class="t" x="36" y="330">Question</text>
  <text class="s" x="36" y="352">Korean / English,</text>
  <text class="s" x="36" y="370">free text</text>

  <rect class="box" x="214" y="304" width="200" height="86" rx="6" style="stroke:#009E73;stroke-width:2"/>
  <text class="t" x="226" y="330">1. Seed (BM25)</text>
  <text class="s" x="226" y="352">title ×3 + body; ASCII words</text>
  <text class="s" x="226" y="370">+ Korean char bigrams</text>

  <rect class="box" x="454" y="304" width="220" height="86" rx="6" style="stroke:#009E73;stroke-width:2"/>
  <text class="t" x="466" y="330">2. Spreading activation</text>
  <text class="s" x="466" y="352">a ← (1−α)s + α·Â·a on the link</text>
  <text class="s" x="466" y="370">graph (α = 0.5, 20 iterations)</text>

  <rect class="box" x="714" y="304" width="222" height="86" rx="6" style="stroke:#0072B2;stroke-width:2"/>
  <text class="t" x="726" y="330">3. Evidence → local LLM</text>
  <text class="s" x="726" y="352">matching lines of top-k notes,</text>
  <text class="s" x="726" y="370">shown first; optional summary</text>

  <rect class="box" x="454" y="420" width="220" height="80" rx="6" style="stroke:#D55E00;stroke-width:2"/>
  <text class="t" x="466" y="446">4. Grounding check</text>
  <text class="s" x="466" y="468">numbers, units, cited slugs</text>
  <text class="s" x="466" y="486">must appear in the evidence</text>

  <rect class="box" x="214" y="420" width="200" height="80" rx="6"/>
  <text class="t" x="226" y="446">Answer</text>
  <text class="s" x="226" y="468">evidence lines (seed / via)</text>
  <text class="s" x="226" y="486">+ cited summary + warnings</text>

  <path class="ln" d="M174,347 H210"/>
  <path class="ln" d="M414,347 H450"/>
  <path class="ln" d="M674,347 H710"/>
  <path class="ln" d="M825,390 V460 H678"/>
  <path class="ln" d="M454,460 H418"/>
  <path class="dash" d="M615,238 C615,270 560,280 560,300"/>
  <text class="s" x="604" y="282" style="font-style:italic">same link graph</text>
</svg>
