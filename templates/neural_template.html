<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>wiki network</title>
<style>
  :root { --bg: #070b16; --ink: #cfd6e4; --mute: #7b8496; --accent: #ff5a5a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #brand { position: fixed; top: 14px; left: 16px; z-index: 5; font-size: 13px; color: var(--mute); }
  #brand b { color: var(--ink); font-weight: 600; }
  #lock { position: fixed; top: 10px; right: 14px; z-index: 5; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15); color: var(--ink); border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #unlockbox { position: fixed; top: 46px; right: 14px; z-index: 6; display: none;
    background: rgba(16,22,36,.92); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 10px; }
  #unlockbox input { background: #0b1020; color: var(--ink); border: 1px solid #2a3348; border-radius: 6px;
    padding: 6px 8px; font-size: 13px; width: 180px; }
  #pwmsg { font-size: 11px; color: var(--mute); margin-top: 6px; min-height: 14px; }
  #tip { position: fixed; z-index: 7; pointer-events: none; display: none; max-width: 340px;
    background: rgba(10,14,26,.92); border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
    padding: 5px 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #panel { position: fixed; left: 14px; bottom: 14px; z-index: 6; display: none; width: min(380px, calc(100vw - 28px));
    max-height: 46vh; overflow: auto; background: rgba(10,14,26,.94); border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  #panel h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.35; }
  #panel .meta { color: var(--mute); font-size: 11px; margin-bottom: 8px; font-family: ui-monospace, Menlo, monospace; }
  #panel .grp { color: var(--accent); font: 11px ui-monospace, Menlo, monospace; margin: 8px 0 2px; }
  #panel a { display: block; color: #9cc3ff; text-decoration: none; padding: 1px 0; cursor: pointer; }
  #panel .x { position: absolute; top: 6px; right: 10px; cursor: pointer; color: var(--mute); }
  #hint { position: fixed; bottom: 12px; right: 16px; z-index: 5; font-size: 11px; color: var(--mute); }
  body.embed #brand, body.embed #lock, body.embed #hint { display: none; }
  @media (max-width: 600px) { #brand span, #hint { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="brand"><b>wiki network</b><span> · sources → notes → hubs → MOC → index</span></div>
<button id="lock">unlock titles</button>
<div id="unlockbox"><input id="pw" type="password" placeholder="password" autocomplete="off"><div id="pwmsg"></div></div>
<div id="tip"></div>
<div id="panel"><span class="x" id="px">×</span><div id="pbody"></div></div>
<div id="hint">hover a neuron · click to inspect</div>
<script>
const DATA = /*__DATA_PUB__*/null;
const ENC = /*__ENC__*/null;
const PLAIN = /*__PLAIN__*/null;
const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.body.classList.add("embed");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

let NAMES = PLAIN ? PLAIN.names : null;
const LCOL = ["#ff8a65", "#7fd6a4", "#f3e3b8", "#8ecae6", "#ffffff"];   // per-layer hue
const N = DATA.deg.length;
const layerOf = new Int8Array(N), rankOf = new Int32Array(N);
DATA.layers.forEach((L, li) => L.nodes.forEach((n, r) => { layerOf[n] = li; rankOf[n] = r; }));
const adj = Array.from({ length: N }, () => []);
const fwd = Array.from({ length: N }, () => []);            // edges toward a higher layer
const E = DATA.links.map(([a, b], i) => {
  adj[a].push(i); adj[b].push(i);
  let s = a, t = b;
  if (layerOf[s] > layerOf[t]) [s, t] = [t, s];
  if (layerOf[s] !== layerOf[t]) fwd[s].push(i);
  return { s, t, same: layerOf[s] === layerOf[t] };
});

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const base = document.createElement("canvas"), bctx = base.getContext("2d");
let W, H, DPR, X = [], Y = new Float32Array(N), colTop = [], colBot = [], colX = [], stars = [];

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [cv, base]) { c.width = W * DPR; c.height = H * DPR; }
  const nl = DATA.layers.length, mx = Math.max(56, W * 0.08);
  const top = Math.max(96, H * 0.16), bot = H - Math.max(40, H * 0.07);
  DATA.layers.forEach((L, li) => {
    colX[li] = mx + (W - 2 * mx) * li / (nl - 1);
    const n = L.nodes.length, span = Math.min(bot - top, Math.max(0, n - 1) * 26);
    const t0 = (top + bot) / 2 - span / 2;
    colTop[li] = t0; colBot[li] = t0 + span;
    L.nodes.forEach((id, r) => { Y[id] = n > 1 ? t0 + span * r / (n - 1) : (top + bot) / 2; });
  });
  X = Array.from(layerOf, li => colX[li]);
  const R = rng(7); stars = [];
  const ns = Math.min(DATA.stars, 1400);
  for (let i = 0; i < ns; i++) stars.push([R() * W, R() * H, R() * 1.1 + 0.2, R() * 6.28]);
  drawBase();
}

function edgePath(c, e) {
  const xa = X[e.s], ya = Y[e.s], xb = X[e.t], yb = Y[e.t];
  c.moveTo(xa, ya);
  if (e.same) {
    const side = layerOf[e.s] < 2 ? -1 : 1, bulge = Math.min(140, 12 + Math.abs(ya - yb) * 0.32);
    c.bezierCurveTo(xa + side * bulge, ya, xb + side * bulge, yb, xb, yb);
  } else {
    const dx = (xb - xa) * 0.5;
    c.bezierCurveTo(xa + dx, ya, xb - dx, yb, xb, yb);
  }
}
function bez(e, t) {     // point on the edge curve at t in [0,1]
  const xa = X[e.s], ya = Y[e.s], xb = X[e.t], yb = Y[e.t];
  let c1x, c2x;
  if (e.same) { const side = layerOf[e.s] < 2 ? -1 : 1, b = Math.min(140, 12 + Math.abs(ya - yb) * 0.32); c1x = xa + side * b; c2x = xb + side * b; }
  else { const dx = (xb - xa) * 0.5; c1x = xa + dx; c2x = xb - dx; }
  const u = 1 - t;
  return [u*u*u*xa + 3*u*u*t*c1x + 3*u*t*t*c2x + t*t*t*xb, u*u*u*ya + 3*u*u*t*ya + 3*u*t*t*yb + t*t*t*yb];
}

function drawBase() {
  const c = bctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.75);
  g.addColorStop(0, "#121a33"); g.addColorStop(1, "#05070f");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // column frames + headers
  c.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
  DATA.layers.forEach((L, li) => {
    const x = colX[li], w = 26, t = colTop[li] - 16, b = colBot[li] + 16;
    c.strokeStyle = "rgba(160,180,220,.22)"; c.lineWidth = 1;
    c.beginPath(); c.roundRect ? c.roundRect(x - w / 2, t, w, b - t, 4) : c.rect(x - w / 2, t, w, b - t); c.stroke();
    if (W < 700) {
      c.fillStyle = "rgba(220,228,245,.85)";
      c.fillText(`NL${li}`, x - 12, t - 22); c.fillText(`${L.nodes.length}`, x - 12, t - 8);
      return;
    }
    const tx = Math.min(Math.max(x - 60, 8), W - c.measureText("Activation: link (click)").width - 12), ty = t - 46;
    c.fillStyle = "rgba(220,228,245,.85)"; c.fillText(`NL ${li}  ${L.name}`, tx, ty);
    c.fillText(`Neurons: ${L.nodes.length}`, tx, ty + 14);
    c.fillStyle = "#ff5a5a"; c.fillText(`Activation: link (click)`, tx, ty + 28);
  });
  // edges, additive glow
  c.globalCompositeOperation = "lighter";
  const dense = E.length > 2500 ? 0.55 : 1;
  for (const e of E) {
    const gr = c.createLinearGradient(X[e.s], Y[e.s], X[e.t], Y[e.t]);
    gr.addColorStop(0, LCOL[layerOf[e.s]]); gr.addColorStop(1, LCOL[layerOf[e.t]]);
    c.strokeStyle = gr; c.globalAlpha = (e.same ? 0.07 : 0.17) * dense; c.lineWidth = e.same ? 0.6 : 0.9;
    c.beginPath(); edgePath(c, e); c.stroke();
  }
  // neurons
  c.globalAlpha = 1;
  for (let i = 0; i < N; i++) {
    const r = 1.1 + Math.min(3.2, Math.sqrt(DATA.deg[i]) * 0.35);
    c.fillStyle = LCOL[layerOf[i]]; c.globalAlpha = 0.85;
    c.beginPath(); c.arc(X[i], Y[i], r, 0, 6.283); c.fill();
  }
  c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
}

// ---- forward-pass pulses ----
const pulses = [], flash = new Float32Array(N);
const seeds = [];
for (let i = 0; i < N; i++) if (layerOf[i] <= 1 && fwd[i].length) seeds.push(i);
function spawnFrom(n) {
  const out = fwd[n]; if (!out.length) return;
  pulses.push({ e: E[out[(Math.random() * out.length) | 0]], t: 0, v: 0.006 + Math.random() * 0.008 });
}

let hover = -1, selected = -1, last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last) / 16.7; last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(base, 0, 0, W, H);
  // stars
  ctx.fillStyle = "#dfe8ff";
  for (const s of stars) { ctx.globalAlpha = 0.25 + 0.25 * Math.sin(now * 0.0008 + s[3]); ctx.fillRect(s[0], s[1], s[2], s[2]); }
  ctx.globalAlpha = 1;
  // pulses
  const cap = REDUCED ? 20 : 260;
  if (pulses.length < cap && seeds.length) for (let k = 0; k < (REDUCED ? 1 : 4); k++) if (Math.random() < 0.5) spawnFrom(seeds[(Math.random() * seeds.length) | 0]);
  ctx.globalCompositeOperation = "lighter";
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += p.v * dt;
    if (p.t >= 1) { flash[p.e.t] = 1; if (Math.random() < 0.7) spawnFrom(p.e.t); pulses.splice(i, 1); continue; }
    const [x, y] = bez(p.e, p.t);
    ctx.fillStyle = LCOL[layerOf[p.e.t]]; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fill();
  }
  for (let i = 0; i < N; i++) if (flash[i] > 0.02) {
    ctx.globalAlpha = flash[i] * 0.7; ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(X[i], Y[i], 3 + 5 * flash[i], 0, 6.283); ctx.fill();
    flash[i] *= Math.pow(0.92, dt);
  }
  // highlight (butterfly)
  const h = selected >= 0 ? selected : hover;
  if (h >= 0) {
    ctx.globalAlpha = 0.85; ctx.lineWidth = 1.1; ctx.strokeStyle = "#f4f7ff";
    ctx.beginPath(); for (const ei of adj[h]) edgePath(ctx, E[ei]); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    for (const ei of adj[h]) { const o = E[ei].s === h ? E[ei].t : E[ei].s; ctx.beginPath(); ctx.arc(X[o], Y[o], 2.4, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(X[h], Y[h], 5, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

// ---- picking ----
function pick(mx, my) {
  let best = -1, bd = 14;
  DATA.layers.forEach((L, li) => {
    if (Math.abs(mx - colX[li]) > 16) return;
    for (const n of L.nodes) { const d = Math.abs(my - Y[n]); if (d < bd) { bd = d; best = n; } }
  });
  return best;
}
const tip = document.getElementById("tip");
const label = n => NAMES ? NAMES[n] : `NL ${layerOf[n]} · #${rankOf[n]} · links ${DATA.deg[n]}`;
if (!EMBED) {
  cv.addEventListener("mousemove", ev => {
    hover = pick(ev.clientX, ev.clientY);
    cv.style.cursor = hover >= 0 ? "pointer" : "default";
    if (hover >= 0) {
      tip.textContent = label(hover); tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 14, W - 350) + "px"; tip.style.top = (ev.clientY + 12) + "px";
    } else tip.style.display = "none";
  });
  cv.addEventListener("mouseleave", () => { hover = -1; tip.style.display = "none"; });
  cv.addEventListener("click", ev => { const n = pick(ev.clientX, ev.clientY); select(n); });
}
const panel = document.getElementById("panel"), pbody = document.getElementById("pbody");
document.getElementById("px").onclick = () => select(-1);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function select(n) {
  selected = n;
  if (n < 0) { panel.style.display = "none"; return; }
  const by = {};
  for (const ei of adj[n]) { const o = E[ei].s === n ? E[ei].t : E[ei].s; (by[layerOf[o]] ||= []).push(o); }
  let html = `<h3>${esc(label(n))}</h3><div class="meta">NL ${layerOf[n]} ${esc(DATA.layers[layerOf[n]].name)} · links ${DATA.deg[n]}</div>`;
  if (!NAMES) html += `<div class="meta">unlock to read titles</div>`;
  for (const li of Object.keys(by).sort()) {
    html += `<div class="grp">→ NL ${li} ${esc(DATA.layers[li].name)} (${by[li].length})</div>`;
    for (const o of by[li].slice(0, 60)) html += `<a data-n="${o}">${esc(label(o))}</a>`;
  }
  pbody.innerHTML = html; panel.style.display = "block";
  pbody.querySelectorAll("a[data-n]").forEach(a => a.onclick = () => select(+a.dataset.n));
}

// ---- unlock (same scheme as /wiki-graph/) ----
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let pt = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(ENC.iv) }, key, b64d(ENC.ct)));
  if (ENC.gz) pt = new Uint8Array(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(pt));
}
const lockBtn = document.getElementById("lock"), box = document.getElementById("unlockbox");
const pw = document.getElementById("pw"), pwmsg = document.getElementById("pwmsg");
if (NAMES) lockBtn.textContent = "titles unlocked";
lockBtn.onclick = () => { if (NAMES) return; box.style.display = box.style.display === "block" ? "none" : "block"; pw.focus(); };
pw.addEventListener("keydown", async ev => {
  if (ev.key !== "Enter" || !ENC) return;
  pwmsg.textContent = "decrypting…";
  try { NAMES = (await decrypt(pw.value)).names; box.style.display = "none"; lockBtn.textContent = "titles unlocked"; if (selected >= 0) select(selected); }
  catch { pwmsg.textContent = "wrong password"; }
});

// embed card: cycle the butterfly highlight over well-connected neurons
if (EMBED || new URLSearchParams(location.search).has("demo")) {
  const hubs = [...Array(N).keys()].filter(i => DATA.deg[i] >= 12 && layerOf[i] >= 1 && layerOf[i] <= 2);
  let k = 0;
  const cycle = () => { if (hubs.length) hover = hubs[(k++ * 7919) % hubs.length]; };
  cycle(); setInterval(cycle, 2600);
}
addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(layout, 120); });
layout(); requestAnimationFrame(frame);
</script>
</body>
</html>
